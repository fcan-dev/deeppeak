name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build the app bundle
        run: scripts/build.sh

      - name: Check the bundle
        run: |
          test -f dist/DeepPeak.app/Contents/Resources/holidays.json
          codesign -dv dist/DeepPeak.app
          lipo -archs dist/DeepPeak.app/Contents/MacOS/DeepPeak

  release:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version from the tag
        run: |
          plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" packaging/Info.plist
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" packaging/Info.plist
          plutil -p packaging/Info.plist

      - name: Build (universal)
        run: scripts/build.sh --universal

      - name: Zip
        run: |
          lipo -archs dist/DeepPeak.app/Contents/MacOS/DeepPeak
          ditto -c -k --keepParent dist/DeepPeak.app "dist/DeepPeak-${GITHUB_REF_NAME}-universal.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "DeepPeak ${GITHUB_REF_NAME}" --generate-notes
